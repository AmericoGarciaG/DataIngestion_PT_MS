# .github/workflows/ci_cd.yml
# VERSIÓN FINAL Y CORREGIDA

name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: ${{ vars.GAR_LOCATION || 'us-central1' }}
  SERVICE_NAME: ${{ vars.SERVICE_NAME || 'data-ingestion-pt-ms' }}
  IMAGE_NAME_BASE: ${{ vars.SERVICE_NAME || 'data-ingestion-pt-ms' }}

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      id: 'auth'
      uses: 'google-github-actions/auth@v2'
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

    - name: Set up Cloud SDK
      uses: 'google-github-actions/setup-gcloud@v2'
      with:
        project_id: ${{ env.GCP_PROJECT_ID }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

    - name: Build and Tag Docker image
      id: docker_build
      run: |
        IMAGE_PATH="${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/${{ env.IMAGE_NAME_BASE }}"
        echo "IMAGE_PATH_WITH_TAG_SHA=${IMAGE_PATH}:${{ github.sha }}" >> $GITHUB_OUTPUT
        echo "IMAGE_PATH_WITH_TAG_LATEST=${IMAGE_PATH}:latest" >> $GITHUB_OUTPUT
        echo "Building Docker image with path: ${IMAGE_PATH}"
        # Usamos la versión corregida del build, que apunta a la carpeta 'service'
        docker build -t "${IMAGE_PATH}:${{ github.sha }}" -t "${IMAGE_PATH}:latest" -f service/Dockerfile service/

    - name: Push Docker image to Artifact Registry
      run: |
        docker push ${{ steps.docker_build.outputs.IMAGE_PATH_WITH_TAG_SHA }}
        docker push ${{ steps.docker_build.outputs.IMAGE_PATH_WITH_TAG_LATEST }}

    - name: Deploy to Cloud Run
      id: 'deploy'
      uses: 'google-github-actions/deploy-cloudrun@v2'
      with:
        service: ${{ env.SERVICE_NAME }}
        region: ${{ env.GAR_LOCATION }}
        image: ${{ steps.docker_build.outputs.IMAGE_PATH_WITH_TAG_SHA }}
        
        # Inyecta las variables de entorno desde las "Repository Variables" de GitHub
        env_vars: |
          GOOGLE_CLOUD_PROJECT_ID=${{ env.GCP_PROJECT_ID }}
          ALPACA_PAPER=${{ vars.ALPACA_PAPER || 'true' }}
          ALPACA_ASSET_SYMBOL=${{ vars.ALPACA_ASSET_SYMBOL || 'AAPL' }}
          FETCH_TIMEFRAME_STR=${{ vars.FETCH_TIMEFRAME_STR || '1day' }}
          FETCH_DAYS_HISTORY=${{ vars.FETCH_DAYS_HISTORY || '30' }}
          SCHEDULE_TRIGGER=${{ vars.SCHEDULE_TRIGGER || 'cron' }}
          SCHEDULE_HOUR=${{ vars.SCHEDULE_HOUR || '21' }}
          SCHEDULE_MINUTE=${{ vars.SCHEDULE_MINUTE || '0' }}
          PUBSUB_TOPIC_NAME=${{ vars.PUBSUB_TOPIC_NAME || 'historical-data-updated' }}
          FIRESTORE_PROVIDERS_COLLECTION=${{ vars.FIRESTORE_PROVIDERS_COLLECTION || 'providers' }}
          FIRESTORE_ASSETS_COLLECTION=${{ vars.FIRESTORE_ASSETS_COLLECTION || 'assets' }}
        
        # Monta los secretos de GCP (Alpaca keys) en el servicio
        secrets: |
          ALPACA_API_KEY_ID=ALPACA_API_KEY_ID:latest
          ALPACA_SECRET_KEY=ALPACA_SECRET_KEY:latest
          
        # Flags cruciales para los permisos del servicio
        flags: "--service-account ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }} --allow-unauthenticated"

    - name: Show deployed service URL
      if: steps.deploy.outputs.url
      run: |
        echo "Service deployed at: ${{ steps.deploy.outputs.url }}"